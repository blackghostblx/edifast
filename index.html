<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ادیتور عکس و متن</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&family=Lalezar&family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Kufi+Arabic:wght@400;700&family=Reem+Kufi:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Roboto:ital,wght@0,400;0,700;1,400&family=Montserrat:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:ital,wght@0,400;0,700;1,400&family=Pacifico&family=Bebas+Neue&family=Oswald:wght@400;700&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #0c0c11);
    --bg2: var(--tg-theme-secondary-bg-color, #15151d);
    --text: var(--tg-theme-text-color, #f2f2f7);
    --hint: var(--tg-theme-hint-color, #85859a);
    --accent: var(--tg-theme-button-color, #7c6cf0);
    --accent2: #ff6b9d;
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --border: rgba(255,255,255,0.08);
    --glass: rgba(255,255,255,0.055);
  }
  html[data-theme="light"]{
    --bg:#f3f3f8; --bg2:#ffffff; --text:#131318; --hint:#6c6c78;
    --border:rgba(0,0,0,0.09); --glass:rgba(0,0,0,0.045);
  }
  html[data-theme="dark"]{
    --bg:#0c0c11; --bg2:#15151d; --text:#f2f2f7; --hint:#85859a;
    --border:rgba(255,255,255,0.08); --glass:rgba(255,255,255,0.055);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg); color:var(--text); font-family:'Vazirmatn', sans-serif;
    overflow:hidden; display:flex; flex-direction:column;
  }
  #app{ display:flex; flex-direction:column; height:100%; }

  header{
    display:flex; align-items:center; gap:10px;
    padding:11px 14px; border-bottom:1px solid var(--border);
    background:var(--bg2); flex-shrink:0;
  }
  header h1{
    font-size:14px; margin:0; font-weight:800; display:flex; align-items:center; gap:7px;
    letter-spacing:-.2px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  header h1 .dot{ width:7px; height:7px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent2)); flex-shrink:0; }
  .icon-toggle{
    background:var(--glass); border:1px solid var(--border); color:var(--text);
    width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:13px; flex-shrink:0; font-weight:700;
  }
  .icon-toggle:active{ transform:scale(0.92); }
  .save-btn{
    background:linear-gradient(135deg,var(--accent),#5b4bd6); color:var(--accent-text); border:none;
    padding:9px 16px; border-radius:11px; font-family:inherit; font-size:13px;
    font-weight:800; cursor:pointer; display:flex; align-items:center; gap:6px; flex-shrink:0;
    box-shadow:0 4px 14px rgba(124,108,240,0.35);
  }
  .save-btn:active{ transform:scale(0.95); }

  #canvasWrap{
    flex:1; display:flex; align-items:stretch; justify-content:stretch;
    overflow:hidden; padding:14px; min-height:0; position:relative;
    background:
      radial-gradient(circle at 30% 20%, rgba(124,108,240,0.10), transparent 55%),
      radial-gradient(circle at 80% 85%, rgba(255,107,157,0.08), transparent 50%),
      var(--bg);
  }
  #editor{
    width:100%; height:100%; display:block;
    touch-action:none; border-radius:14px;
    box-shadow:0 20px 50px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06);
    background:#333;
  }
  #emptyHint{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    text-align:center; color:var(--hint); font-size:13px;
    pointer-events:none; padding:0 34px; line-height:2; max-width:280px;
  }
  #loadingOverlay{
    position:absolute; inset:14px; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:12px; background:rgba(12,12,17,0.75); backdrop-filter:blur(6px);
    z-index:5; border-radius:14px;
  }
  #loadingOverlay.show{ display:flex; }
  .spinner{
    width:34px; height:34px; border-radius:50%;
    border:3px solid rgba(255,255,255,0.15); border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loadingOverlay span{ font-size:12.5px; color:var(--hint); }

  #toast{
    position:absolute; left:50%; bottom:18px; transform:translate(-50%,10px);
    background:rgba(20,20,26,0.95); color:#fff; padding:10px 18px; border-radius:12px;
    font-size:12.5px; font-weight:700; opacity:0; pointer-events:none; transition:all .25s ease;
    box-shadow:0 8px 24px rgba(0,0,0,0.4); white-space:nowrap; z-index:6;
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }

  #toolbar{
    display:flex; gap:10px; padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    background:var(--bg2); border-top:1px solid var(--border); flex-shrink:0;
    overflow-x:auto; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch;
  }
  #toolbar::-webkit-scrollbar{ height:0; }
  .tbtn{
    scroll-snap-align:start; flex:0 0 auto; min-width:72px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:10px 14px; border-radius:16px; font-family:inherit; font-size:11px; font-weight:700; cursor:pointer;
    color:var(--text); background:linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
    border:1px solid var(--border);
    box-shadow:0 2px 0 rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.06);
    transition:transform .08s ease;
  }
  html[data-theme="light"] .tbtn{
    background:linear-gradient(180deg, rgba(0,0,0,0.03), rgba(0,0,0,0.01));
    box-shadow:0 2px 0 rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .tbtn:active{ transform:translateY(2px); box-shadow:inset 0 2px 5px rgba(0,0,0,0.3); }
  .tbtn.active{
    border-color:var(--accent); color:#fff;
    background:linear-gradient(180deg, rgba(124,108,240,0.45), rgba(124,108,240,0.16));
  }
  .tbtn svg{ width:19px; height:19px; }

  #panel{
    position:absolute; left:10px; right:10px; bottom:10px; z-index:4;
    background:rgba(21,21,29,0.94); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border); border-radius:16px;
    max-height:56%; overflow-y:auto;
    display:none; padding:14px 16px 16px;
    box-shadow:0 12px 34px rgba(0,0,0,0.4);
  }
  html[data-theme="light"] #panel{ background:rgba(255,255,255,0.94); }
  #panel.open{ display:block; animation:slideUp .18s ease; }
  @keyframes slideUp{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .panel-head b{ font-size:13.5px; font-weight:800; }
  .panel-head-actions{ display:flex; gap:8px; }
  .icon-btn{
    background:var(--glass); border:1px solid var(--border); color:var(--text);
    width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:14px;
  }
  .icon-btn:active{ transform:scale(0.92); }
  .icon-btn.danger{ color:#ff6b7d; }
  .row{ margin-bottom:14px; }
  .row label{ display:block; font-size:11px; color:var(--hint); margin-bottom:6px; font-weight:700; }
  textarea, select, input[type=text]{
    width:100%; background:rgba(127,127,127,0.08); border:1px solid var(--border);
    color:var(--text); padding:10px 12px; border-radius:11px; font-family:inherit; font-size:14px;
    resize:vertical; outline:none;
  }
  textarea:focus, select:focus{ border-color:var(--accent); }
  textarea{ min-height:50px; }
  input[type=range]{ width:100%; accent-color:var(--accent); }
  input[type=color]{
    width:38px; height:34px; border:1px solid var(--border); border-radius:9px;
    background:none; padding:2px; cursor:pointer;
  }
  .range-row{ display:flex; align-items:center; gap:10px; }
  .range-row span{ font-size:11px; color:var(--hint); min-width:38px; text-align:left; }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .chip-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    display:flex; align-items:center; gap:6px; background:var(--glass);
    border:1px solid var(--border); padding:7px 12px; border-radius:20px; font-size:12px; cursor:pointer;
    font-weight:600;
  }
  .chip:has(input:checked){ border-color:var(--accent); background:rgba(124,108,240,0.18); color:#fff; }
  .chip input{ margin:0; accent-color:var(--accent); }
  optgroup{ font-weight:700; }
  hr.sep{ border:none; border-top:1px solid var(--border); margin:16px 0; }
  #fileInput, #stickerInput, #homeUploadInput{ display:none; }
  .section-title{ font-size:12px; font-weight:800; color:var(--text); margin:0 0 10px; }
  .hint-note{ color:var(--hint); font-size:11.5px; line-height:1.9; margin-top:14px; background:var(--glass); padding:10px 12px; border-radius:11px; border:1px solid var(--border); }
  details.panel-group{ border:1px solid var(--border); border-radius:12px; margin-bottom:10px; background:var(--glass); overflow:hidden; }
  details.panel-group summary{ padding:11px 12px; font-size:12.5px; font-weight:800; cursor:pointer; list-style:none; display:flex; align-items:center; justify-content:space-between; }
  details.panel-group summary::-webkit-details-marker{ display:none; }
  details.panel-group summary::after{ content:'›'; color:var(--hint); font-size:16px; transform:rotate(90deg); transition:transform .15s ease; }
  details.panel-group[open] summary::after{ transform:rotate(-90deg); }
  details.panel-group .panel-group-body{ padding:2px 12px 14px; border-top:1px solid var(--border); }

  /* ---------- Home screen ---------- */
  #home{ display:flex; flex-direction:column; height:100%; overflow-y:auto; }
  #home.hidden, #app.hidden{ display:none; }
  .home-topbar{
    direction:ltr; display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; flex-shrink:0;
  }
  .home-logo{
    width:34px; height:34px; border-radius:50%; overflow:hidden; flex-shrink:0;
    background:var(--bg2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
  }
  .home-logo img{ width:100%; height:100%; object-fit:cover; }
  .home-topbar-actions{ display:flex; gap:8px; }
  .home-topbar-actions .icon-toggle{ border-radius:50%; width:34px; height:34px; }

  .home-body{ padding:4px 16px 24px; display:flex; flex-direction:column; gap:16px; flex:1; }

  .profile-card{
    direction:ltr; display:flex; align-items:center; gap:14px;
    background:var(--bg2); border:1px solid var(--border); border-radius:18px;
    padding:14px; cursor:pointer; text-align:left;
  }
  .profile-card:active{ transform:scale(0.98); }
  .avatar{
    width:58px; height:58px; border-radius:50%; flex-shrink:0; position:relative;
    background:var(--glass); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; }
  .avatar svg{ width:28px; height:28px; color:var(--hint); }
  .avatar-plus{
    position:absolute; bottom:-2px; right:-2px; width:20px; height:20px; border-radius:50%;
    background:linear-gradient(135deg,var(--accent),#5b4bd6); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900;
    border:2px solid var(--bg2);
  }
  .profile-info{ flex:1; min-width:0; }
  .profile-name{ font-size:15px; font-weight:800; direction:rtl; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .profile-username{ font-size:12px; color:var(--hint); direction:ltr; text-align:right; margin-top:2px; }
  .profile-edits{
    margin-top:8px; display:inline-flex; align-items:center; gap:5px;
    background:var(--glass); border:1px solid var(--border); border-radius:20px;
    padding:4px 10px; font-size:11.5px; font-weight:700; direction:rtl;
  }

  .leaderboard-card{
    background:var(--bg2); border:1px solid var(--border); border-radius:18px; padding:14px;
  }
  .leaderboard-title{ font-size:13px; font-weight:800; margin:0 0 12px; display:flex; align-items:center; gap:6px; }
  .lb-row{ direction:ltr; display:flex; align-items:center; gap:10px; padding:8px 0; }
  .lb-row + .lb-row{ border-top:1px solid var(--border); }
  .lb-rank{ width:20px; text-align:center; font-size:14px; font-weight:900; flex-shrink:0; }
  .lb-avatar{ width:36px; height:36px; border-radius:50%; overflow:hidden; flex-shrink:0; background:var(--glass); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; }
  .lb-avatar img{ width:100%; height:100%; object-fit:cover; }
  .lb-avatar svg{ width:18px; height:18px; color:var(--hint); }
  .lb-info{ flex:1; min-width:0; direction:rtl; text-align:right; }
  .lb-name{ font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lb-count{ font-size:11px; color:var(--hint); }
  .lb-empty{ color:var(--hint); font-size:12px; text-align:center; padding:10px 0; }

  .new-edit-btn{
    margin-top:auto; background:linear-gradient(135deg,var(--accent),#5b4bd6); color:var(--accent-text);
    border:none; padding:15px; border-radius:16px; font-family:inherit; font-size:14.5px; font-weight:800;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
    box-shadow:0 8px 22px rgba(124,108,240,0.35);
  }
  .new-edit-btn:active{ transform:scale(0.97); }

  .back-btn{
    background:var(--glass); border:1px solid var(--border); color:var(--text);
    width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .back-btn:active{ transform:scale(0.92); }

  /* ---------- Text layer corner action buttons ---------- */
  #textActions{ position:absolute; inset:0; pointer-events:none; z-index:7; display:none; }
  #textActions.show{ display:block; }
  .ta-btn{
    position:absolute; width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transform:translate(-50%,-50%);
    border:2px solid #fff; color:#fff; font-size:15px; line-height:1;
    cursor:pointer; pointer-events:auto; box-shadow:0 3px 10px rgba(0,0,0,0.4);
  }
  .ta-btn:active{ transform:translate(-50%,-50%) scale(0.88); }
  #taDelete{ background:#ff4d5e; }
  #taEdit{ background:#7c6cf0; }
  #taRotate{ background:#00d68f; }
  #taFlip{ background:#3f8cff; }
</style>
</head>
<body>
<div id="home">
  <div class="home-topbar">
    <div class="home-logo"><img src="/logo.png" alt="Edifast"></div>
    <div class="home-topbar-actions">
      <button class="icon-toggle" id="homeThemeBtn">🌓</button>
      <button class="icon-toggle" id="homeLangBtn">FA</button>
    </div>
  </div>

  <div class="home-body">
    <div class="profile-card" id="profileCard">
      <div class="avatar" id="profileAvatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        <div class="avatar-plus">+</div>
      </div>
      <div class="profile-info">
        <div class="profile-name" id="profileName">…</div>
        <div class="profile-username" id="profileUsername"></div>
        <div class="profile-edits"><span data-i18n="edits_label">تعداد ادیت‌ها</span>: <span id="profileEditCount">0</span></div>
      </div>
    </div>

    <div class="leaderboard-card">
      <p class="leaderboard-title">🏆 <span data-i18n="leaderboard_title">برترین ادیتورها</span></p>
      <div id="leaderboardList"><div class="lb-empty" data-i18n="leaderboard_empty">هنوز کسی ادیتی نزده</div></div>
    </div>

    <button class="new-edit-btn" id="newEditBtn">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      <span data-i18n="new_edit">ادیت جدید</span>
    </button>
  </div>
</div>
<input type="file" id="homeUploadInput" accept="image/*">

<div id="app" class="hidden">
  <header>
    <button class="back-btn" id="backBtn">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1><span class="dot"></span><span data-i18n="title">ادیتور عکس و متن</span></h1>
    <button class="icon-toggle" id="langBtn">FA</button>
    <button class="icon-toggle" id="themeBtn">🌓</button>
    <button class="save-btn" id="saveBtn">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      <span data-i18n="save">ذخیره</span>
    </button>
  </header>

  <div id="canvasWrap">
    <div id="emptyHint" data-i18n="emptyHint">یک عکس اضافه کن یا مستقیم روی بوم متن بذار ✨</div>
    <canvas id="editor" width="1000" height="1000"></canvas>
    <div id="loadingOverlay"><div class="spinner"></div><span data-i18n="loading">در حال دریافت عکس از تلگرام…</span></div>
    <div id="toast"></div>
    <div id="panel"></div>
    <div id="textActions">
      <button class="ta-btn" id="taDelete" title="delete">🗑</button>
      <button class="ta-btn" id="taEdit" title="edit">✎</button>
      <button class="ta-btn" id="taRotate" title="rotate">⟳</button>
      <button class="ta-btn" id="taFlip" title="flip">⇋</button>
    </div>
  </div>

  <div id="toolbar">
    <button class="tbtn" id="addImageBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <span data-i18n="tb_image">تصویر</span>
    </button>
    <button class="tbtn" id="addStickerBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
      <span data-i18n="tb_sticker">روی عکس</span>
    </button>
    <button class="tbtn" id="addTextBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
      <span data-i18n="tb_text">متن</span>
    </button>
    <button class="tbtn" id="effectsBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/><circle cx="12" cy="12" r="3.5"/></svg>
      <span data-i18n="tb_effects">افکت</span>
    </button>
    <button class="tbtn" id="cropBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
      <span data-i18n="tb_crop">برش</span>
    </button>
    <button class="tbtn" id="resizeBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
      <span data-i18n="tb_resize">ابعاد</span>
    </button>
    <button class="tbtn" id="gifBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2.5"/><path d="M7 10v4M11 10v4M11 12h1.5"/><path d="M16.5 10a1.5 1.5 0 0 0-1.5 1.5v1a1.5 1.5 0 0 0 3 0"/></svg>
      <span data-i18n="gif_btn">گیف</span>
    </button>
  </div>
  <input type="file" id="fileInput" accept="image/*">
  <input type="file" id="stickerInput" accept="image/*">
</div>

<script>
(function(){
  'use strict';

  // ---------- Telegram integration ----------

  // ---------- Canvas setup ----------
  const canvas = document.getElementById('editor');

  let layers = [];

  let cropMode = false;
  let cropLayer = null;

  function uid(){ return 'l'+(idCounter++); }

  // ---------- Responsive cover-fit canvas (no empty sides) ----------
  function rescaleCanvas(newW, newH){
    const oldW = canvas.width, oldH = canvas.height;
    canvas.width = newW; canvas.height = newH;
    if(oldW && oldH && (oldW!==newW || oldH!==newH)){
      const rx = newW/oldW, ry = newH/oldH;
      layers.forEach(l=>{
        l.x*=rx; l.y*=ry; l.width*=rx; l.height*=ry;
        if(l.type==='text') l.baseFontSize *= (rx+ry)/2;
      });
      if(cropLayer){ cropLayer.x*=rx; cropLayer.y*=ry; cropLayer.width*=rx; cropLayer.height*=ry; }
    }
  }
  function resizeCanvasToContainer(){
    const w = Math.max(1, Math.round(canvas.clientWidth));
    const h = Math.max(1, Math.round(canvas.clientHeight));
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    let tw = Math.round(w*dpr), th = Math.round(h*dpr);
    const MAXD = 1600;
    if(Math.max(tw,th) > MAXD){ const s = MAXD/Math.max(tw,th); tw=Math.round(tw*s); th=Math.round(th*s); }
    if(tw===canvas.width && th===canvas.height) return;
    rescaleCanvas(tw, th);
    draw();
  }
  let resizeRAF;
  function scheduleResize(){
    if(resizeRAF) cancelAnimationFrame(resizeRAF);
    resizeRAF = requestAnimationFrame(resizeCanvasToContainer);
  }
  if(window.ResizeObserver){ new ResizeObserver(scheduleResize).observe(wrap); }
  else{ window.addEventListener('resize', scheduleResize); }

  function coverFit(img){
    const scale = Math.max(canvas.width/img.naturalWidth, canvas.height/img.naturalHeight);
    return { width: img.naturalWidth*scale, height: img.naturalHeight*scale };
  }

  // ---------- Layer helpers ----------
  function makeTextLayer(text){
    return {
      id: uid(), type:'text', text: text || t('default_text'),
      x: canvas.width/2, y: canvas.height/2,
      width: canvas.width*0.55, height: canvas.height*0.09,
      baseFontSize: canvas.height*0.065,
      fontFamily: 'Vazirmatn', bold:true, italic:false,
      color:'#ffffff', align:'center', rotation:0, opacity:1, flipX:false,
      outline:{ enabled:false, color:'#000000', width:6 },
      shadow:{ enabled:true, color:'#000000', blur:14, offsetX:0, offsetY:3 },
      bg:{ enabled:false, color:'#000000', opacity:0.4 }
    };
  }
  function makeImageLayer(img, role, width, height){
    return {
      id: uid(), type:'image', role, img,
      x: canvas.width/2, y: canvas.height/2, width, height, rotation:0, opacity:1,
      filters:{ brightness:100, contrast:100, saturate:100, blur:0, grayscale:0 }
    };
  }
  function addBackgroundImage(img){
    const {width,height} = coverFit(img);
    let bg = layers.find(x=>x.role==='background');
    if(bg){ bg.img=img; bg.width=width; bg.height=height; bg.x=canvas.width/2; bg.y=canvas.height/2; bg.rotation=0; }
    else{ bg = makeImageLayer(img,'background',width,height); layers.unshift(bg); }
    draw();
  }
  function addStickerImage(img){
    const w = Math.min(canvas.width,canvas.height)*0.5;
    const h = w * (img.naturalHeight/img.naturalWidth);
    const l = makeImageLayer(img,'sticker', w, h);
    layers.push(l); selected=l; selectLayer(l); draw();
  }

  // ---------- Text measuring ----------
  function fontString(l, size){
    const style = l.italic ? 'italic ' : '';
    const weight = l.bold ? '700 ' : '400 ';
    return `${style}${weight}${size}px "${l.fontFamily}"`;
  }
  function measureNatural(l){
    ctx.font = fontString(l, l.baseFontSize);
    const lines = (l.text || '').split('\n');
    let maxW = 1;
    lines.forEach(ln=>{ maxW = Math.max(maxW, ctx.measureText(ln || ' ').width); });
    const h = lines.length * l.baseFontSize * 1.3;
    return { w: Math.max(maxW, 1), h: Math.max(h, 1), lines };
  }

  // ---------- Transform helpers ----------
  function toLocal(px, py, l){
    const dx = px - l.x, dy = py - l.y;
    const cos = Math.cos(-l.rotation), sin = Math.sin(-l.rotation);
    return { x: dx*cos - dy*sin, y: dx*sin + dy*cos };
  }

  // ---------- Drawing ----------
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.save();
    ctx.beginPath();
    ctx.rect(0,0,canvas.width,canvas.height);
    ctx.clip();
    layers.forEach(l=>{
      ctx.save();
      ctx.globalAlpha = l.opacity != null ? l.opacity : 1;
      ctx.translate(l.x, l.y);
      ctx.rotate(l.rotation || 0);
      if(l.type==='image'){
        if(l.filters){
          ctx.filter = `brightness(${l.filters.brightness}%) contrast(${l.filters.contrast}%) saturate(${l.filters.saturate}%) blur(${l.filters.blur}px) grayscale(${l.filters.grayscale}%)`;
        }
        ctx.drawImage(l.img, -l.width/2, -l.height/2, l.width, l.height);
      } else if(l.type==='text'){
        drawTextLayer(l);
      }
      ctx.restore();
    });
    ctx.restore();

    if(cropMode && cropLayer && !exporting) drawCropOverlay();
    if(selected && !exporting && !cropMode){
      if(!(selected.role==='background' && !bgEditMode)) drawSelection(selected);
    }
    if(selected && selected.type==='text' && !exporting && !cropMode){
      showTextActions(selected);
    } else {
      hideTextActions();
    }
    emptyHint.style.display = layers.length ? 'none' : 'block';
  }

  function drawTextLayer(l){
    const nat = measureNatural(l);
    const scaleX = l.width / nat.w;
    const scaleY = l.height / nat.h;

    if(l.bg && l.bg.enabled){
      ctx.save();
      ctx.globalAlpha *= l.bg.opacity;
      ctx.fillStyle = l.bg.color;
      const pad = 16;
      roundRect(-l.width/2-pad, -l.height/2-pad, l.width+pad*2, l.height+pad*2, 14);
      ctx.fill();
      ctx.restore();
    }

    ctx.scale(scaleX * (l.flipX ? -1 : 1), scaleY);
    ctx.font = fontString(l, l.baseFontSize);
    ctx.textAlign = l.align || 'center';
    ctx.textBaseline = 'middle';

    const lineH = l.baseFontSize * 1.3;
    const startY = -((nat.lines.length-1)*lineH)/2;
    const alignX = l.align==='left' ? -nat.w/2 : l.align==='right' ? nat.w/2 : 0;

    if(l.shadow && l.shadow.enabled){
      ctx.shadowColor = l.shadow.color;
      ctx.shadowBlur = l.shadow.blur;
      ctx.shadowOffsetX = l.shadow.offsetX;
      ctx.shadowOffsetY = l.shadow.offsetY;
    }

    nat.lines.forEach((ln, i)=>{
      const yy = startY + i*lineH;
      if(l.outline && l.outline.enabled){
        ctx.lineWidth = l.outline.width;
        ctx.strokeStyle = l.outline.color;
        ctx.lineJoin = 'round';
        ctx.strokeText(ln, alignX, yy);
      }
      ctx.shadowColor = (l.shadow && l.shadow.enabled) ? l.shadow.color : 'transparent';
      ctx.fillStyle = l.color;
      ctx.fillText(ln, alignX, yy);
    });
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function handlePositions(l){
    const w=l.width/2, h=l.height/2;
    // Text layers only get edge handles (drag to stretch/tall the font) — the four
    // corners are reserved for the on-canvas delete/edit/rotate/flip buttons instead.
    if(l.type==='text'){
      return { n:{x:0,y:-h}, s:{x:0,y:h}, w:{x:-w,y:0}, e:{x:w,y:0} };
    }
    const hp = {
      nw:{x:-w,y:-h}, n:{x:0,y:-h}, ne:{x:w,y:-h},
      w:{x:-w,y:0},               e:{x:w,y:0},
      sw:{x:-w,y:h}, s:{x:0,y:h}, se:{x:w,y:h}
    };
    if(!l.noRotate) hp.rotate = {x:0,y:-h-34};
    return hp;
  }

  function drawSelection(l){
    ctx.save();
    ctx.translate(l.x, l.y);
    ctx.rotate(l.rotation||0);
    ctx.strokeStyle = '#7c6cf0';
    ctx.lineWidth = 2;
    ctx.setLineDash([6,5]);
    ctx.strokeRect(-l.width/2, -l.height/2, l.width, l.height);
    ctx.setLineDash([]);

    const hp = handlePositions(l);
    if(hp.rotate){
      ctx.beginPath();
      ctx.moveTo(hp.n.x, hp.n.y);
      ctx.lineTo(hp.rotate.x, hp.rotate.y);
      ctx.strokeStyle='#7c6cf0'; ctx.lineWidth=2; ctx.stroke();
    }
    Object.keys(hp).forEach(key=>{
      const p = hp[key];
      ctx.beginPath();
      if(key==='rotate'){ ctx.fillStyle = '#00d68f'; ctx.arc(p.x,p.y,9,0,Math.PI*2); }
      else{ ctx.fillStyle = '#ffffff'; ctx.rect(p.x-7,p.y-7,14,14); }
      ctx.fill();
      ctx.strokeStyle='#7c6cf0'; ctx.lineWidth=2; ctx.stroke();
    });
    ctx.restore();
  }

  function drawCropOverlay(){
    const off = document.createElement('canvas');
    off.width = canvas.width; off.height = canvas.height;
    const octx = off.getContext('2d');
    octx.fillStyle='rgba(0,0,0,0.6)';
    octx.fillRect(0,0,off.width,off.height);
    octx.globalCompositeOperation='destination-out';
    const rx=cropLayer.x-cropLayer.width/2, ry=cropLayer.y-cropLayer.height/2;
    octx.fillRect(rx,ry,cropLayer.width,cropLayer.height);
    ctx.drawImage(off,0,0);

    ctx.save();
    ctx.translate(cropLayer.x, cropLayer.y);
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=2; ctx.setLineDash([8,6]);
    ctx.strokeRect(-cropLayer.width/2,-cropLayer.height/2,cropLayer.width,cropLayer.height);
    ctx.setLineDash([]);
    const hp = handlePositions(cropLayer);
    Object.keys(hp).forEach(key=>{
      const p = hp[key];
      ctx.beginPath(); ctx.fillStyle='#fff'; ctx.rect(p.x-8,p.y-8,16,16); ctx.fill();
      ctx.strokeStyle='#7c6cf0'; ctx.lineWidth=2; ctx.stroke();
    });
    ctx.restore();
  }

  // ---------- Text layer corner action buttons ----------
  // Selecting text no longer pops the full settings panel open (hard to see/use).
  // Instead four small buttons sit on the corners of the text box: delete, edit
  // (opens the real settings panel), rotate (90° per tap) and flip (mirror).
  const textActionsEl = document.getElementById('textActions');
  const taDelete = document.getElementById('taDelete');
  const taEdit = document.getElementById('taEdit');
  const taRotate = document.getElementById('taRotate');
  const taFlip = document.getElementById('taFlip');

  function canvasPointToScreen(px, py){
    const cRect = canvas.getBoundingClientRect();
    const wRect = wrap.getBoundingClientRect();
    const sx = cRect.width / canvas.width;
    const sy = cRect.height / canvas.height;
    return { x: (cRect.left - wRect.left) + px*sx, y: (cRect.top - wRect.top) + py*sy };
  }
  function rotatedCorner(l, lx, ly){
    const cos = Math.cos(l.rotation||0), sin = Math.sin(l.rotation||0);
    return { x: l.x + lx*cos - ly*sin, y: l.y + lx*sin + ly*cos };
  }
  function updateTextActionsPos(l){
    const w = l.width/2, h = l.height/2;
    const place = (el, lx, ly)=>{
      const c = rotatedCorner(l, lx, ly);
      const p = canvasPointToScreen(c.x, c.y);
      el.style.left = p.x+'px'; el.style.top = p.y+'px';
    };
    place(taDelete, -w, -h);
    place(taEdit, w, -h);
    place(taRotate, -w, h);
    place(taFlip, w, h);
  }
  function showTextActions(l){
    updateTextActionsPos(l);
    textActionsEl.classList.add('show');
  }
  function hideTextActions(){
    textActionsEl.classList.remove('show');
  }
  taDelete.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(!selected || selected.type!=='text') return;
    layers = layers.filter(x=>x.id!==selected.id);
    selected = null; closePanel(); hideTextActions(); draw();
  });
  taEdit.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(!selected || selected.type!=='text') return;
    renderTextPanel(selected);
    panel.classList.add('open');
  });
  taRotate.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(!selected || selected.type!=='text') return;
    selected.rotation = (selected.rotation||0) + Math.PI/2;
    draw();
    syncPanelValues();
  });
  taFlip.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(!selected || selected.type!=='text') return;
    selected.flipX = !selected.flipX;
    draw();
  });

  // ---------- Pointer interaction ----------
  let drag = null;
  const activePointers = new Map();
  let pinchStartDist = null;
  let pinchStartSize = null;

  function getPos(evt){
    const rect = canvas.getBoundingClientRect();
    const sx = canvas.width/rect.width, sy = canvas.height/rect.height;
    return { x:(evt.clientX-rect.left)*sx, y:(evt.clientY-rect.top)*sy };
  }
  function hitHandle(l, pos){
    const local = toLocal(pos.x,pos.y,l);
    const hp = handlePositions(l);
    for(const key of Object.keys(hp)){
      const p = hp[key];
      if(Math.hypot(local.x-p.x, local.y-p.y) < 26) return key;
    }
    return null;
  }

  canvas.addEventListener('pointerdown', (e)=>{
    canvas.setPointerCapture(e.pointerId);
    const pos = getPos(e);
    activePointers.set(e.pointerId, pos);

    // Two-finger pinch to zoom the background photo — only while resize mode is on
    if(activePointers.size===2 && bgEditMode && selected && selected.role==='background'){
      const pts = [...activePointers.values()];
      pinchStartDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1;
      pinchStartSize = { width: selected.width, height: selected.height };
      drag = null;
      return;
    }

    if(cropMode){
      let mode = hitHandle(cropLayer, pos);
      if(!mode){
        const local = toLocal(pos.x,pos.y,cropLayer);
        if(Math.abs(local.x)<=cropLayer.width/2 && Math.abs(local.y)<=cropLayer.height/2) mode='move';
      }
      if(mode){
        drag = { mode, layer:cropLayer, startPos:pos,
          startLayer:{x:cropLayer.x,y:cropLayer.y,width:cropLayer.width,height:cropLayer.height,rotation:0} };
      }
      draw();
      return;
    }

    let mode = null, layer = null;
    if(selected && !(selected.role==='background' && !bgEditMode)){
      const h = hitHandle(selected, pos);
      if(h){ mode = h; layer = selected; }
    }
    if(!mode){
      for(let i=layers.length-1;i>=0;i--){
        const l = layers[i];
        if(l.role==='background' && !bgEditMode) continue; // locked: taps pass through
        const local = toLocal(pos.x,pos.y,l);
        if(Math.abs(local.x)<=l.width/2 && Math.abs(local.y)<=l.height/2){ layer = l; mode='move'; break; }
      }
    }
    if(layer){
      selected = layer;
      selectLayer(layer);
      drag = { mode, layer, startPos:pos,
        startLayer:{x:layer.x,y:layer.y,width:layer.width,height:layer.height,rotation:layer.rotation} };
    } else {
      selected = null;
      bgEditMode = false;
      closePanel();
    }
    draw();
  });

  window.addEventListener('pointermove', (e)=>{
    if(activePointers.has(e.pointerId)) activePointers.set(e.pointerId, getPos(e));

    if(activePointers.size===2 && pinchStartDist && selected && selected.role==='background'){
      e.preventDefault();
      const pts = [...activePointers.values()];
      const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      const scale = dist/pinchStartDist;
      selected.width = Math.max(24, pinchStartSize.width*scale);
      selected.height = Math.max(24, pinchStartSize.height*scale);
      draw();
      return;
    }

    if(!drag) return;
    e.preventDefault();
    const pos = getPos(e);
    const { mode, layer, startPos, startLayer } = drag;

    if(mode==='move'){
      layer.x = startLayer.x + (pos.x-startPos.x);
      layer.y = startLayer.y + (pos.y-startPos.y);
    } else if(mode==='rotate'){
      layer.rotation = Math.atan2(pos.y-layer.y, pos.x-layer.x) + Math.PI/2;
    } else {
      const local = toLocal(pos.x,pos.y,layer);
      const MIN = 24;
      if(mode.includes('e') || mode.includes('w')) layer.width = Math.max(MIN, Math.abs(local.x)*2);
      if(mode.includes('n') || mode.includes('s')) layer.height = Math.max(MIN, Math.abs(local.y)*2);
    }

    if(layer===cropLayer){
      layer.width = Math.min(layer.width, canvas.width);
      layer.height = Math.min(layer.height, canvas.height);
      const hw=layer.width/2, hh=layer.height/2;
      layer.x = Math.min(Math.max(layer.x,hw), canvas.width-hw);
      layer.y = Math.min(Math.max(layer.y,hh), canvas.height-hh);
    }

    draw();
    syncPanelValues();
  }, {passive:false});

    drag = null;
  });

  });

    exporting = true; draw();

  async function exportPNG(){
    const wasSelected = selected;
    selected = null; exporting = true;

    // Render the export at the photo's real resolution instead of whatever
    // size the screen happened to draw the canvas at, so the output isn't
    // downscaled/upscaled or cropped to an unrelated device aspect ratio.
    const curW = canvas.width, curH = canvas.height;
    const bg = layers.find(l=>l.role==='background');
    let targetW = curW, targetH = curH;
    if(bg && bg.img && bg.width){
      const nativeScale = bg.img.naturalWidth / bg.width;
      targetW = Math.round(curW * nativeScale);
      targetH = Math.round(curH * nativeScale);
    }
    const MAX_EXPORT = 2400, MIN_EXPORT = 800;
    const longEdge = Math.max(targetW, targetH);
    if(longEdge > MAX_EXPORT){ const s = MAX_EXPORT/longEdge; targetW = Math.round(targetW*s); targetH = Math.round(targetH*s); }
    else if(longEdge < MIN_EXPORT){ const s = MIN_EXPORT/longEdge; targetW = Math.round(targetW*s); targetH = Math.round(targetH*s); }
    const resized = (targetW !== curW || targetH !== curH);
    if(resized) rescaleCanvas(targetW, targetH);
    draw();

    canvas.toBlob(async (blob)=>{
      if(resized) rescaleCanvas(curW, curH);
      exporting = false; selected = wasSelected; draw();
      if(!blob) return;

      // Primary path: deliver straight into the user's chat with the bot.
      // Works inside Telegram's WebView even where downloads/share are blocked.
      if(tg && tg.initData){
        try{
          const base64 = await blobToBase64(blob);
          const res = await fetch('/api/deliver', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ initData: tg.initData, image: base64 })
          });
          const data = await res.json();
          if(data.ok){
            if(tg.HapticFeedback){ try{ tg.HapticFeedback.notificationOccurred('success'); }catch(e){} }
            showToast(t('saved_to_chat'));
            return;
          }
        }catch(e){ console.error('deliver failed, falling back to download/share', e); }
      }

      // Fallback: Web Share, then plain download (used outside Telegram or if delivery failed)
      const file = new File([blob], 'edited-image.png', {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({ files:[file], title:'edited image' }); return; }catch(e){}
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'edited-image.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      showToast(t('saved_fallback'));
    }, 'image/png');
  }
  document.getElementById('saveBtn').addEventListener('click', exportPNG);

  // ---------- GIF (real .gif file, not a video, so Telegram shows an actual GIF) ----------
  // Telegram's sendAnimation only renders inline as a GIF for real GIF (or H.264 mp4)
  // files — a webm video gets delivered as a plain video attachment instead. Since the
  // canvas content itself doesn't move, we build a real single-frame GIF89a file
  // client-side (fixed 252-color palette + GIF LZW encoding) instead of recording video.
  function buildGifPalette(){
    const palette = [];
    for(let r=0;r<6;r++) for(let g=0;g<7;g++) for(let b=0;b<6;b++){
      palette.push([Math.round(r/5*255), Math.round(g/6*255), Math.round(b/5*255)]);
    }
    while(palette.length < 256) palette.push([0,0,0]);
    return palette;
  }
  function quantizeToIndices(imageData){
    const { data, width, height } = imageData;
    const indices = new Uint8Array(width*height);
    for(let i=0, p=0; i<data.length; i+=4, p++){
      const r = Math.round(data[i]/255*5);
      const g = Math.round(data[i+1]/255*6);
      const b = Math.round(data[i+2]/255*5);
      indices[p] = r*42 + g*6 + b;
    }
    return indices;
  }
  function lzwEncodeGif(minCodeSize, indices){
    const clearCode = 1 << minCodeSize;
    const eoiCode = clearCode + 1;
    const bytes = [];
    let bitBuffer = 0, bitCount = 0, dict, nextCode, codeSize;
    function writeCode(code){
      bitBuffer |= (code << bitCount);
      bitCount += codeSize;
      while(bitCount >= 8){ bytes.push(bitBuffer & 0xFF); bitBuffer >>= 8; bitCount -= 8; }
    }
    function resetDict(){
      dict = new Map();
      for(let i=0;i<clearCode;i++) dict.set(String(i), i);
      nextCode = eoiCode + 1;
      codeSize = minCodeSize + 1;
    }
    resetDict();
    writeCode(clearCode);
    let w = String(indices[0]);
    for(let i=1;i<indices.length;i++){
      const k = indices[i];
      const wk = w + ',' + k;
      if(dict.has(wk)){
        w = wk;
      } else {
        writeCode(dict.get(w));
        // GIF's LZW code-size bump must be checked *before* the new entry is
        // added (this is the classic GIF "early change" quirk) — checking
        // after, like a plain textbook LZW encoder, produces a bitstream
        // real decoders (Telegram, browsers, PIL, etc.) can't read past the
        // first size boundary.
        if(nextCode >= (1<<codeSize) && codeSize < 12) codeSize++;
        if(nextCode < 4096){
          dict.set(wk, nextCode);
          nextCode++;
        } else {
          writeCode(clearCode);
          resetDict();
        }
        w = String(k);
      }
    }
    writeCode(dict.get(w));
    writeCode(eoiCode);
    if(bitCount > 0) bytes.push(bitBuffer & 0xFF);
    return bytes;
  }
  function buildGif89a(width, height, indices){
    const palette = buildGifPalette();
    const bytes = [];
    const pushStr = s=>{ for(let i=0;i<s.length;i++) bytes.push(s.charCodeAt(i)); };
    const push16 = n=>{ bytes.push(n & 0xFF, (n>>8) & 0xFF); };
    pushStr('GIF89a');
    push16(width); push16(height);
    bytes.push(0xF7, 0, 0); // global color table w/ 256 entries, bg index 0, aspect 0
    palette.forEach(c=> bytes.push(c[0], c[1], c[2]));
    bytes.push(0x21, 0xF9, 0x04, 0x00, 0x0A, 0x00, 0x00, 0x00); // graphic control ext
    bytes.push(0x2C); push16(0); push16(0); push16(width); push16(height); bytes.push(0x00); // image descriptor
    const minCodeSize = 8;
    bytes.push(minCodeSize);
    const lzw = lzwEncodeGif(minCodeSize, indices);
    for(let i=0;i<lzw.length;i+=255){
      const chunk = lzw.slice(i, i+255);
      bytes.push(chunk.length, ...chunk);
    }
    bytes.push(0x00, 0x3B); // block terminator + trailer
    return new Uint8Array(bytes);
  }
  async function makeGif(){
    if(!layers.length){ alert(t('no_image_alert')); return; }
    showToast(t('gif_making'));
    const wasSelected = selected;
    try{
      selected = null; exporting = true; draw();

      // Cap the GIF's resolution — plenty for a chat sticker, keeps encoding fast.
      const GIF_MAX = 640;
      const longEdge = Math.max(canvas.width, canvas.height);
      const scale = Math.min(1, GIF_MAX/longEdge);
      const gw = Math.max(1, Math.round(canvas.width*scale));
      const gh = Math.max(1, Math.round(canvas.height*scale));
      const off = document.createElement('canvas');
      off.width = gw; off.height = gh;
      const octx = off.getContext('2d');
      octx.drawImage(canvas, 0, 0, gw, gh);

      exporting = false; selected = wasSelected; draw();

      const imageData = octx.getImageData(0, 0, gw, gh);
      const indices = quantizeToIndices(imageData);
      const gifBytes = buildGif89a(gw, gh, indices);
      const blob = new Blob([gifBytes], { type:'image/gif' });

      if(tg && tg.initData){
        try{
          const base64 = await blobToBase64(blob);
          const res = await fetch('/api/deliver', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ initData: tg.initData, gif: base64 })
          });
          const data = await res.json();
          if(data.ok){ showToast(t('gif_sent')); return; }
        }catch(e){ console.error('gif deliver failed', e); }
      }
      // Fallback outside Telegram (or if delivery failed): plain download.
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'edifast.gif'; a.click();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
    }catch(e){
      exporting = false; selected = wasSelected; draw();
      console.error('gif creation failed', e);
      alert(t('gif_error'));
    }
  }
  document.getElementById('gifBtn').addEventListener('click', makeGif);
  if(tg && tg.MainButton){
    try{ tg.MainButton.setText(t('save')); tg.MainButton.onClick(exportPNG); }catch(e){}
  }

  // ---------- Home screen / navigation ----------
  const homeScreen = document.getElementById('home');
  const appScreen = document.getElementById('app');
  function personSvg(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>';
  }
  function showHome(){
    appScreen.classList.add('hidden');
    homeScreen.classList.remove('hidden');
    if(tg && tg.MainButton){ try{ tg.MainButton.hide(); }catch(e){} }
    refreshProfile();
    refreshLeaderboard();
  }
  function showEditor(){
    homeScreen.classList.add('hidden');
    appScreen.classList.remove('hidden');
    if(tg && tg.MainButton){ try{ tg.MainButton.show(); }catch(e){} }
    resizeCanvasToContainer();
    draw();
  }
  function resetEditor(){
    layers = []; selected = null; cropMode = false; cropLayer = null;
    panel.classList.remove('open'); panel.innerHTML = '';
    draw();
  }
  document.getElementById('backBtn').addEventListener('click', showHome);
  document.getElementById('newEditBtn').addEventListener('click', ()=>{
    resetEditor();
    showEditor();
  });

  let myProfile = null;
  async function refreshProfile(){
    const nameEl = document.getElementById('profileName');
    const userEl = document.getElementById('profileUsername');
    const editsEl = document.getElementById('profileEditCount');
    const avatarEl = document.getElementById('profileAvatar');
    if(!(tg && tg.initData)){
      nameEl.textContent = t('anonymous');
      userEl.textContent = '';
      editsEl.textContent = '0';
      return;
    }
    try{
      const res = await fetch('/api/profile', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ initData: tg.initData })
      });
      const data = await res.json();
      if(data.ok){
        myProfile = data.profile;
        nameEl.textContent = data.profile.name || t('anonymous');
        userEl.textContent = data.profile.username ? '@'+data.profile.username : '';
        editsEl.textContent = data.edits || 0;
        if(data.profile.photo_url){
          avatarEl.innerHTML = '<img src="'+data.profile.photo_url+'" alt="">'+'<div class="avatar-plus">+</div>';
        }
      }
    }catch(e){ console.error('profile fetch failed', e); }
  }

  async function refreshLeaderboard(){
    const list = document.getElementById('leaderboardList');
    try{
      const res = await fetch('/api/leaderboard');
      const data = await res.json();
      if(!data.ok || !data.leaderboard || !data.leaderboard.length){
        list.innerHTML = '<div class="lb-empty">'+escapeHtml(t('leaderboard_empty'))+'</div>';
        return;
      }
      const medals = ['🥇','🥈','🥉'];
      list.innerHTML = data.leaderboard.map((u,i)=>{
        const avatar = u.photo_url ? '<img src="'+u.photo_url+'" alt="">' : personSvg();
        const name = escapeHtml(u.name || (u.username?'@'+u.username:'') || t('anonymous'));
        return '<div class="lb-row">'
          + '<div class="lb-rank">'+(medals[i]||(i+1))+'</div>'
          + '<div class="lb-avatar">'+avatar+'</div>'
          + '<div class="lb-info"><div class="lb-name">'+name+'</div><div class="lb-count">'+u.edits+' '+escapeHtml(t('edits_suffix'))+'</div></div>'
          + '</div>';
      }).join('');
    }catch(e){
      console.error('leaderboard fetch failed', e);
      list.innerHTML = '<div class="lb-empty">'+escapeHtml(t('leaderboard_empty'))+'</div>';
    }
  }

  // Tapping the avatar/profile card jumps straight into a new edit with a device photo.
  document.getElementById('profileCard').addEventListener('click', ()=>{
    document.getElementById('homeUploadInput').click();
  });
  document.getElementById('homeUploadInput').addEventListener('change', (e)=>{
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if(!file) return;
    resetEditor();
    showEditor();
    loadImageFile(file, addBackgroundImage);
  });

  // ---------- Auto-load photo sent in chat ----------
  async function loadFromTelegramFile(fileId){
    loadingOverlay.classList.add('show');
    try{
      const res = await fetch('/api/image?file_id=' + encodeURIComponent(fileId));
      if(!res.ok) throw new Error('fetch failed');
      const blob = await res.blob();
      const img = new Image();
      const url = URL.createObjectURL(blob);
      await new Promise((resolve, reject)=>{ img.onload = resolve; img.onerror = reject; img.src = url; });
      addBackgroundImage(img);
      URL.revokeObjectURL(url);
    }catch(e){ console.error('could not load telegram photo', e); }
    finally{ loadingOverlay.classList.remove('show'); }
  }

  // ---------- Init ----------
  currentLang = detectLang();
  applyI18n();
  if(tg && tg.onEvent){ try{ tg.onEvent('themeChanged', ()=>draw()); }catch(e){} }
  (function initRoute(){
    // Coming from "edit this photo" in the chat -> jump straight into the editor.
    // Otherwise (plain /start) -> land on the home screen first.
    try{
      const params = new URLSearchParams(location.search);
      const fileId = params.get('file_id');
      if(fileId){
        showEditor();
        loadFromTelegramFile(fileId);
        return;
      }
    }catch(e){}
    showHome();
  })();
})();
</script>
</body>
